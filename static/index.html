<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bazos Car Listings</title>
  <style>
    :root {
      --bg: #fcfcfb;
      --surface: #ffffff;
      --text: #0b0b0b;
      --muted: #52514e;
      --border: #e3e2de;
      --accent: #2a78d6;
      --new: #1baf7a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a19;
        --surface: #232322;
        --text: #ffffff;
        --muted: #c3c2b7;
        --border: #3a3a38;
        --accent: #3987e5;
        --new: #199e70;
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1000px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .subtitle { color: var(--muted); margin: 0 0 24px; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
    .stat .label { color: var(--muted); font-size: 0.85rem; }
    .stat .value { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }

    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 16px; }
    .filters label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
    .filters label.checkbox { flex-direction: row; align-items: center; padding-bottom: 8px; }
    input, select {
      font: inherit;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
    }
    input[type="search"] { width: 220px; }
    input[type="number"] { width: 110px; }

    .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
    tr:last-child td { border-bottom: none; }
    td.title { white-space: normal; min-width: 240px; }
    td.price { text-align: right; font-variant-numeric: tabular-nums; }
    th.price { text-align: right; }
    td.muted { color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 0.75rem; color: #fff; background: var(--new); }
    .empty { padding: 32px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>Bazos Car Listings</h1>
  <p class="subtitle">Used-car listings collected from bazos.sk by scraper.py</p>

  <section class="stats">
    <div class="stat"><div class="label">Listings shown</div><div class="value" id="stat-count">–</div></div>
    <div class="stat"><div class="label">Median price</div><div class="value" id="stat-median">–</div></div>
    <div class="stat"><div class="label">Cheapest</div><div class="value" id="stat-min">–</div></div>
    <div class="stat"><div class="label">New today</div><div class="value" id="stat-today">–</div></div>
  </section>

  <section class="filters">
    <label>Search<input type="search" id="search" placeholder="Title or location"></label>
    <label>Min price (€)<input type="number" id="min-price" min="0" step="500"></label>
    <label>Max price (€)<input type="number" id="max-price" min="0" step="500"></label>
    <label>Sort by
      <select id="sort">
        <option value="newest">Newest first</option>
        <option value="cheapest">Cheapest first</option>
        <option value="expensive">Most expensive first</option>
      </select>
    </label>
    <label class="checkbox"><input type="checkbox" id="show-no-price" checked>&nbsp;Include listings without a price</label>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Title</th><th class="price">Price</th><th>Location</th><th>First seen</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>
</main>

<script>
  let allCars = [];

  const priceFormat = new Intl.NumberFormat("sk-SK", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });

  function formatDate(iso) {
    const date = new Date(iso);
    return date.toLocaleString("sk-SK", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" });
  }

  function todayString() {
    // first_seen is stored in local time, so compare against the local date, not UTC
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
  }

  function median(numbers) {
    if (numbers.length === 0) return null;
    const sorted = [...numbers].sort((a, b) => a - b);
    const middle = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
  }

  function filteredCars() {
    const search = document.getElementById("search").value.trim().toLowerCase();
    const minPrice = parseInt(document.getElementById("min-price").value, 10);
    const maxPrice = parseInt(document.getElementById("max-price").value, 10);
    const showNoPrice = document.getElementById("show-no-price").checked;
    const sort = document.getElementById("sort").value;

    const cars = allCars.filter((car) => {
      const text = `${car.title} ${car.location || ""}`.toLowerCase();
      if (search && !text.includes(search)) return false;
      if (car.price_eur === null) return showNoPrice;
      if (!isNaN(minPrice) && car.price_eur < minPrice) return false;
      if (!isNaN(maxPrice) && car.price_eur > maxPrice) return false;
      return true;
    });

    // listings without a price always go to the end when sorting by price
    const byPrice = (a, b, direction) => {
      if (a.price_eur === null) return 1;
      if (b.price_eur === null) return -1;
      return (a.price_eur - b.price_eur) * direction;
    };
    if (sort === "cheapest") cars.sort((a, b) => byPrice(a, b, 1));
    if (sort === "expensive") cars.sort((a, b) => byPrice(a, b, -1));
    if (sort === "newest") cars.sort((a, b) => b.first_seen.localeCompare(a.first_seen));
    return cars;
  }

  function cell(text, className) {
    const td = document.createElement("td");
    // textContent (not innerHTML) so text from the website can't inject HTML into our page
    td.textContent = text;
    if (className) td.className = className;
    return td;
  }

  function render() {
    const cars = filteredCars();
    const today = todayString();
    const tbody = document.getElementById("rows");
    tbody.replaceChildren();

    for (const car of cars) {
      const tr = document.createElement("tr");

      const titleCell = cell("", "title");
      const link = document.createElement("a");
      link.textContent = car.title;
      if (car.link.startsWith("https://") || car.link.startsWith("http://")) link.href = car.link;
      link.target = "_blank";
      link.rel = "noopener";
      titleCell.append(link);
      if (car.first_seen.startsWith(today)) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "new";
        titleCell.append(badge);
      }

      tr.append(
        titleCell,
        cell(car.price_eur !== null ? priceFormat.format(car.price_eur) : car.price_raw || "–", "price"),
        cell(car.location || "–", "muted"),
        cell(formatDate(car.first_seen), "muted"),
      );
      tbody.append(tr);
    }

    const prices = cars.map((car) => car.price_eur).filter((price) => price !== null);
    const medianPrice = median(prices);
    document.getElementById("stat-count").textContent = cars.length;
    document.getElementById("stat-median").textContent = medianPrice !== null ? priceFormat.format(medianPrice) : "–";
    document.getElementById("stat-min").textContent = prices.length ? priceFormat.format(Math.min(...prices)) : "–";
    document.getElementById("stat-today").textContent = cars.filter((car) => car.first_seen.startsWith(today)).length;

    const empty = document.getElementById("empty");
    empty.hidden = cars.length > 0;
    empty.textContent = allCars.length === 0
      ? "The database is empty. Run scraper.py first."
      : "No listings match these filters.";
  }

  async function load() {
    try {
      const response = await fetch("/api/cars");
      allCars = await response.json();
    } catch (error) {
      allCars = [];
      console.error("Could not load listings", error);
    }
    render();
  }

  for (const id of ["search", "min-price", "max-price", "sort", "show-no-price"]) {
    document.getElementById(id).addEventListener("input", render);
  }
  load();
</script>
</body>
</html>
